services:
  - type: web
    name: venom-modz-backend
    env: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: BOT_SECRET
        generateValue: true
      - key: COOKIE_SECRET
        generateValue: true
      - key: PORT
        value: 3000
      - key: NODE_VERSION
        value: 18.20.4
